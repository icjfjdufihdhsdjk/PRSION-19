<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="PRSION-19 — une prison fictive vivante à observer." />
    <title>PRSION-19</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <small>SURVEILLANCE / SECTEUR 01</small>
          <h1>PRSION-19</h1>
        </div>
        <p><i></i> ACCUEIL CENTRAL · 6 VIES AUTONOMES</p>
        <time id="clock">06:38</time>
      </header>

      <section id="stage" class="stage" aria-label="Accueil vivant de PRSION-19">
        <canvas id="world" aria-label="Faites glisser pour déplacer la caméra et cliquez sur un personnage."></canvas>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="help">
          <strong>REGARDEZ LA SCÈNE VIVRE</strong>
          <span>Glisser : caméra · Molette : zoom · Clic : personnage</span>
        </div>
        <nav class="controls" aria-label="Contrôles de caméra">
          <button id="zoom-out" title="Dézoomer">−</button>
          <output id="zoom-value">75%</output>
          <button id="zoom-in" title="Zoomer">+</button>
          <button id="reset" title="Recentrer">◎</button>
          <button id="labels" title="Afficher les noms">Aa</button>
        </nav>
        <aside id="card" class="card" hidden>
          <button id="close-card" class="close" aria-label="Fermer">×</button>
          <small>DOSSIER PERSONNEL</small>
          <h2 id="card-name"></h2>
          <strong id="card-role"></strong>
          <p id="card-description"></p>
          <div class="activity">
            <i></i>
            <span><small>ACTIVITÉ ACTUELLE</small><b id="card-activity"></b></span>
          </div>
        </aside>
      </section>
      <footer>
        <span>● FLUX AUTONOME ACTIF</span>
        <span>PERSONNE N’EST CONTRÔLÉ PAR LE VISITEUR</span>
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
